# Servidor do frontend (spec §6.6, §11.1): estáticos do Vite e proxy de /api/* para a API, na mesma origem (sem CORS).
# Incluído no contexto "http" do nginx (/etc/nginx/conf.d/default.conf).

# Cache por caminho ORIGINAL da requisição e pelo status: assets com hash existentes ficam imutáveis (um 404 de asset
# não); index.html e demais respostas sempre revalidam; respostas da API, inclusive erros, nunca são guardadas.
map $request_uri $tipo_de_conteudo {
    ~^/api/      api;
    ~^/assets/   asset;
    default      pagina;
}

map "$tipo_de_conteudo:$status" $controle_de_cache {
    ~^api:       "no-store";
    "asset:200"  "public, max-age=31536000, immutable";
    "asset:304"  "public, max-age=31536000, immutable";
    default      "no-cache";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança (valem para todas as respostas, inclusive as da API e as de erro).
    add_header Cache-Control $controle_de_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Arquivos ocultos (.env, .git...) nunca são servidos.
    location ~ /\. {
        return 404;
    }

    # Proxy da API: /api/pedidos?pagina=2 → http://api:8080/pedidos?pagina=2. O prefixo sai; método, corpo, query
    # string e o status/Problem Details da resposta passam sem alteração (proxy_intercept_errors fica desligado).
    # O nome "api" é resolvido a cada 10 s pelo DNS do Docker: se a API for recriada (novo IP), o proxy continua.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $destino_api http://api:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $destino_api;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /api;

        # O Cache-Control da API é substituído pelo "no-store" acima (um só cabeçalho).
        proxy_hide_header Cache-Control;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }

    location = /api {
        return 404;
    }

    # SPA: qualquer outro caminho devolve o index.html (página única, sem rotas no cliente).
    location / {
        try_files $uri /index.html;
    }

    # Assets do build: o nome tem hash; se não existir, 404 (nunca o index.html no lugar de um .js).
    location /assets/ {
        try_files $uri =404;
    }
}
